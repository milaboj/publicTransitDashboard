<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Public Transit in Seattle</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <!-- include google web fonts -->
  <link href="https://fonts.googleapis.com/css?family=Titillium+Web|Oswald" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.8.1/mapbox-gl.css" rel="stylesheet">
  <!-- include icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/c3.min.css">
  <a href="about.html">About</a>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Titillium Web', serif;
    }

    #map {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    #info {
      z-index: 1000;
      position: absolute;
      width: 500px;
      top: 1%;
      bottom: 1%;
      left: .5%;
      padding: 40px 15px 900px 15px;
      background: #343a40;
      color: white;

    }

    #info a:hover {
      color: white;
      opacity: 0.3;
    }


    #title {
      font-size: 25px;
      font-family: 'Oswald', sans-serif;
    }

    #desc {
      text-align: center;
      color: lightgray;
      font-size: medium;
      font-weight: bold;
      margin-bottom: 0px;
    }

    #layers {
        margin-top: 25px;
        padding: 15px;
        background: #212529;
        border-radius: 6px;
        font-size: 14px;
    }

    #layers h5 {
        margin-top: 0;
        color: orange;
    }

    #layers label {
        cursor: pointer;
        display: block;
        margin-bottom: 6px;
    }
    .nav-links a {
        margin-left: 15px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: lightgray;
        text-decoration: none;
    }
    
    .nav-links a:hover {
        color: white;
        text-decoration: underline;
    }
    .nav-links a.active {
        color: orange;
        font-weight: bold;
    }

    #layers hr {
    border: none;
    border-top: 1px solid #444;
    margin: 12px 0;
    }

    #layers h5 {
    margin-bottom: 8px;
    }

    #footer {
      position: absolute;
      bottom: 0px;
      margin-bottom: 20px;
      margin-right: 10px;
      font-size: 13px;
      line-height: 150%;
      color: lightgray;
    }
  </style>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.8.1/mapbox-gl.js"></script>
  <script src="js/d3.js"></script>
  <script src="js/c3.min.js"></script>
</head>

<body>
  <div id="info">
    <div id="title">
        Public Transit in Seattle
        <span class="nav-links">
            <a href="about.html">About</a>
        </span>
    </div>
    <div id="count" class="card">
      <h5 id="desc">Public transit networks in Seattle</h5>
      <p id="earthquake-count"></p>
    </div>
    <div id="earthquake-chart"></div>
    <div id="layers">
        <label>
          <input type="checkbox" id="neighborhood-toggle" checked>
          Neighborhoods
        </label>
        <h5>Transit Layers</h5>

        <label>
            <input type="checkbox" id="bus-stops-toggle" checked>
            Bus Stops
        </label><br>

        <label>
            <input type="checkbox" id="rail-stops-toggle" checked>
            Light Rail Stops
        </label><br>
        </div>

        <hr>

<h5>Walking Access</h5>

<label>
  <input type="checkbox" id="walk5-toggle">
  5-minute walk
</label>

<label>
  <input type="checkbox" id="walk10-toggle">
  10-minute walk
</label>

<label>
  <input type="checkbox" id="walk15-toggle">
  15-minute walk
</label>
    <div id="footer">

    </div>
  </div>
  <div id="map"></div>
  <div id="legend"></div>
  <script>
    // assign the access token
    mapboxgl.accessToken =
      'pk.eyJ1IjoibWlsYWJvIiwiYSI6ImNsbnFjbG9xZTB0MmIya3B0eDFwNDEwY3gifQ.9SzpYF3dZCwahgWShbsRiQ';

    // declare the map object
    let map = new mapboxgl.Map({
      container: 'map', // container ID
      style: 'mapbox://styles/mapbox/dark-v10',
      zoom: 10.5, // starting zoom
      minZoom: 2,
      center: [-122.4, 47.62] // starting center
    });
    map.on("load", function () {
      map.addSource('neighborhoods', {
        type: 'geojson',
        data: 'assets/neighborhoods.geojson'
      });
          /*fetch('assets/busStops.geojson')
            .then(res => res.json())
            .then(data => {
                const buffer5 = turf.buffer(data, 0.4, {units: 'kilometers'});
                map.addSource('buffer5', {
                    type: 'geojson',
                    data: buffer5
                });
                map.addLayer({
                    id: 'buffer5-layer',
                    type: 'fill',
                    source: 'buffer5',
                    layout: {
                      visibility: 'none'
                    },
                    paint: {
                        'fill-color': '#00ff00',
                        'fill-opacity': 0.05
                    }
                });
                // 10-minute buffer
                const buffer10 = turf.buffer(data, 0.8, {units: 'kilometers'});
                map.addSource('buffer10', { type: 'geojson', data: buffer10 });
                map.addLayer({
                    id: 'buffer10-layer',
                    type: 'fill',
                    source: 'buffer10',
                    layout: { visibility: 'none' },
                    paint: { 'fill-color': '#ffff00', 'fill-opacity': 0.05 }
                });

                // 15-minute buffer
                const buffer15 = turf.buffer(data, 1.0, {units: 'kilometers'});
                map.addSource('buffer15', { type: 'geojson', data: buffer15 });
                map.addLayer({
                    id: 'buffer15-layer',
                    type: 'fill',
                    source: 'buffer15',
                    layout: { visibility: 'none' },
                    paint: { 'fill-color': '#ff0000', 'fill-opacity': 0.05 }
                });
            }); */
      map.addSource('buffer5', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
      });

      map.addSource('buffer10', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
      });

      map.addSource('buffer15', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
      });    
        
      map.addSource('bus-stops', {
          type: 'geojson',
          data: 'assets/busStops.geojson'
      });

      map.addSource('rail-stops', {
          type: 'geojson',
          data: 'assets/lightStops2.geojson'
      });
      map.addLayer({
        id: 'neighborhood-outline',
        type: 'line',
        source: 'neighborhoods',
        paint: {
            'line-color': '#000000',
            'line-width': 3
        }
      });
      

      map.addLayer({
          id: 'bus-stops-layer',
          type: 'circle',
          source: 'bus-stops',
          paint: {
              'circle-radius': 4,
              'circle-color': 'purple',
              'circle-stroke-width': 1,
              'circle-stroke-color': 'black'
          }
      });
      map.addLayer({
          id: 'rail-stops-layer',
          type: 'circle',
          source: 'rail-stops',
          paint: {
              'circle-radius': 6,
              'circle-color': '#a9c7ee',
              'circle-stroke-width': 1,
              'circle-stroke-color': '#000'
          }
      });
      map.addLayer({
        id: 'neighborhood-labels',
        type: 'symbol',
        source: 'neighborhoods',
        layout: {
            'text-field': ['get', 'S_HOOD'], 
            'text-font': ['Open Sans Bold'],
            'text-size': 12
        },
        paint: {
            'text-color': '#000000',
            'text-halo-color': '#ffffff',
            'text-halo-width': 2
        }
      });
      map.addLayer({
          id: 'buffer5-layer',
          type: 'fill',
          source: 'buffer5',
          layout: { visibility: 'none' },
          paint: {
              'fill-color': '#00ff00',
              'fill-opacity': 0.4
          }
      });

      map.addLayer({
          id: 'buffer10-layer',
          type: 'fill',
          source: 'buffer10',
          layout: { visibility: 'none' },
          paint: {
              'fill-color': '#ffff00',
              'fill-opacity': 0.4
          }
      });

      map.addLayer({
          id: 'buffer15-layer',
          type: 'fill',
          source: 'buffer15',
          layout: { visibility: 'none' },
          paint: {
              'fill-color': '#ff0000',
              'fill-opacity': 0.4
          }
      });
      map.on('click', 'rail-stops-layer', function(e){

          const station = e.features[0];

          const buffer5 = turf.buffer(station, 0.4, {units:'kilometers'});
          const buffer10 = turf.buffer(station, 0.8, {units:'kilometers'});
          const buffer15 = turf.buffer(station, 1.0, {units:'kilometers'});

          map.getSource('buffer5').setData(buffer5);
          map.getSource('buffer10').setData(buffer10);
          map.getSource('buffer15').setData(buffer15);

      });
      map.on('click', 'bus-stops-layer', function(e){

          const station = e.features[0];

          const buffer5 = turf.buffer(station, 0.4, {units:'kilometers'});
          const buffer10 = turf.buffer(station, 0.8, {units:'kilometers'});
          const buffer15 = turf.buffer(station, 1.0, {units:'kilometers'});

          map.getSource('buffer5').setData(buffer5);
          map.getSource('buffer10').setData(buffer10);
          map.getSource('buffer15').setData(buffer15);

      });
      console.log(map.getLayer('rail-stops-layer'));
      map.addLayer({
        id: 'neighborhood-fill',
        type: 'fill',
        source: 'neighborhoods',
        paint: {
            'fill-color': '#0080ff',
            'fill-opacity': 0.2
        }
      });
      document.getElementById('neighborhood-toggle').addEventListener('change', function (e) {
          map.setLayoutProperty(
              'neighborhood-fill',
              'visibility',
              e.target.checked ? 'visible' : 'none'
          );
      });
      document.getElementById('neighborhood-toggle').addEventListener('change', function (e) {

          let visibility = e.target.checked ? 'visible' : 'none';

          map.setLayoutProperty('neighborhood-fill', 'visibility', visibility);
          map.setLayoutProperty('neighborhood-outline', 'visibility', visibility);
          map.setLayoutProperty('neighborhood-labels', 'visibility', visibility);

      });
      document.getElementById('bus-stops-toggle').addEventListener('change', function (e) {
          map.setLayoutProperty(
              'bus-stops-layer',
              'visibility',
              e.target.checked ? 'visible' : 'none'
          );
      });
      document.getElementById('rail-stops-toggle').addEventListener('change', function (e) {
        map.setLayoutProperty(
            'rail-stops-layer',
            'visibility',
            e.target.checked ? 'visible' : 'none'
        );
      });
      document.getElementById('walk5-toggle').addEventListener('change', function (e) {
          map.setLayoutProperty(
              'buffer5-layer',
              'visibility',
              e.target.checked ? 'visible' : 'none'
          );
      });
      document.getElementById('walk10-toggle').addEventListener('change', e => {
          map.setLayoutProperty('buffer10-layer', 'visibility', e.target.checked ? 'visible' : 'none');
      });
      document.getElementById('walk15-toggle').addEventListener('change', e => {
          map.setLayoutProperty('buffer15-layer', 'visibility', e.target.checked ? 'visible' : 'none');
      });
      map.on('click', 'rail-stops-layer', function (e) {

          const coordinates = e.features[0].geometry.coordinates.slice();
          const stationName = e.features[0].properties.STATION;

          new mapboxgl.Popup()
              .setLngLat(coordinates)
              .setHTML("<b>Light Rail Station:</b><br>" + stationName)
              .addTo(map);

      });
      map.on('click', 'bus-stops-layer', function (e) {

          const coordinates = e.features[0].geometry.coordinates.slice();
          const stopName = e.features[0].properties.STOP_NAME || "Bus Stop";

          new mapboxgl.Popup()
              .setLngLat(coordinates)
              .setHTML(stopName)
              .addTo(map);

      });

      map.on('mouseenter', 'rail-stops-layer', () => {
          map.getCanvas().style.cursor = 'pointer';
      });

      map.on('mouseleave', 'rail-stops-layer', () => {
          map.getCanvas().style.cursor = '';
      });

      map.on('mouseenter', 'bus-stops-layer', () => {
          map.getCanvas().style.cursor = 'pointer';
      });

      map.on('mouseleave', 'bus-stops-layer', () => {
          map.getCanvas().style.cursor = '';
      });
    });
  </script>
</body>

</html>
